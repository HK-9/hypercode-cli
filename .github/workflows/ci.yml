name: hypercode-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purpose:
        description: Why this CI run was dispatched
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hypercode-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hypercode-ci:
    name: hypercode-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run validate:release
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - name: Fetch Changesets comparison base
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Require a Changeset for package changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: npx changeset status --since origin/main
